name: Deploy to Amazon ECR

on:
  push:
    branches: [ main ]
  # 코드 변경 없이도 수동으로 빌드/푸시를 트리거할 수 있게 함
  workflow_dispatch:

# OIDC로 AWS 역할을 assume하기 위해 필요. 이 덕분에 AWS 액세스키를
# GitHub Secret으로 저장할 필요가 없음 (기존 Docker Hub 방식과의 차이점).
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: gochuchamchi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Maven 빌드
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. AWS 인증 (OIDC) — 역할은 인프라 저장소의 terraform/ecr.tf에서 생성.
      #    신뢰 정책이 이 저장소의 main 브랜치로 제한되어 있음.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::307223751140:role/gochuchamchi-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      # 5. ECR 로그인
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 push
      #    Argo CD Image Updater가 이 저장소를 감시하다 새 태그를 감지해서
      #    gochuchamchi-gitops에 write-back 커밋을 남김
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
