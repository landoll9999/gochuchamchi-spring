# =============================================================================
# gochuchamchi CI — 빌드 → 보안 검사 → ECR push (보안 내장형)
#
# 저장 위치: 앱 저장소(gochuchamchi-spring)의 .github/workflows/ci-build-push.yml
#   ※ 이 파일은 terraform 폴더가 아니라 "앱 저장소"에 커밋해야 동작한다!
#
# 사전 조건:
#   1. terraform apply로 github-oidc.tf 반영 → 출력된 github_actions_role_arn을
#      아래 role-to-assume에 붙여넣기 (또는 저장소 Variables에 AWS_ROLE_ARN으로 등록)
#   2. GitHub Secrets에 AWS 키 저장 금지 — OIDC라서 필요 없음 (그게 핵심)
#
# 배포 연결: push된 :latest 태그를 ArgoCD Image Updater가 감지 → gitops 저장소에
#   write-back → ArgoCD가 클러스터에 반영. 즉 이 워크플로는 "ECR까지만" 책임진다
#   (CI와 CD의 책임 분리 — 클러스터 자격증명이 GitHub에 존재하지 않는 이유).
# =============================================================================

name: ci-build-push

1. 아까 다운로드 폴더로 드렸던 guardduty-discord 폴더 안에 ci-build-push.yml이 같이 들어 있어요 — 그거 옮기셨다면 거기서 열면 됩니다.
2. 아니면 그냥 아래 내용을 통째로 복사해서 GitHub 웹 편집기에 바로 붙여넣으세요 (이게 제일 빠름):

# =============================================================================
# gochuchamchi CI — 빌드 → 보안 검사 → ECR push (보안 내장형)
#
# 저장 위치: 앱 저장소(gochuchamchi-spring)의 .github/workflows/ci-build-push.yml
#   ※ 이 파일은 terraform 폴더가 아니라 "앱 저장소"에 커밋해야 동작한다!
#
# 사전 조건:
#   1. terraform apply로 github-oidc.tf 반영 → 출력된 github_actions_role_arn을
#      아래 role-to-assume에 붙여넣기 (또는 저장소 Variables에 AWS_ROLE_ARN으로 등록)
#   2. GitHub Secrets에 AWS 키 저장 금지 — OIDC라서 필요 없음 (그게 핵심)
#
# 배포 연결: push된 :latest 태그를 ArgoCD Image Updater가 감지 → gitops 저장소에
#   write-back → ArgoCD가 클러스터에 반영. 즉 이 워크플로는 "ECR까지만" 책임진다
#   (CI와 CD의 책임 분리 — 클러스터 자격증명이 GitHub에 존재하지 않는 이유).
# =============================================================================

name: ci-build-push

on:
  push:
    branches: [main]   # github-oidc.tf의 trust 조건과 일치해야 함 (다르면 AssumeRole 거부)
  workflow_dispatch: {} # 수동 실행 (인프라 재구축 후 이미지 재푸시용)

permissions:
  id-token: write # OIDC 토큰 발급 허용 — 이 한 줄이 액세스 키를 대체한다
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: gochuchamchi
  # terraform output github_actions_role_arn 값으로 교체
  AWS_ROLE_ARN: arn:aws:iam::307223751140:role/gochuchamchi-github-actions-ecr

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (전체 히스토리 — gitleaks가 과거 커밋까지 검사)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 보안 검사 1: 시크릿 유출 스캔 ------------------------------------
      # 커밋에 AWS 키/비밀번호/PAT가 섞여 들어갔으면 여기서 실패 → push 차단
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 빌드 --------------------------------------------------------------
      - name: Docker build
        run: docker build -t $ECR_REPO:${{ github.sha }} .

      # --- 보안 검사 2: 이미지 취약점 게이트 ---------------------------------
      # ECR push "전에" 스캔해서 HIGH/CRITICAL이면 push 자체를 막는다.
      # (ECR scan_on_push + Inspector는 push "후" 상시 감시 — 역할이 다름:
      #  Trivy = 반입 차단 게이트, Inspector = 반입 후 신규 CVE 상시 재평가)
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REPO }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true # 패치가 아직 없는 CVE는 게이트에서 제외 (차단해도 대응 불가)

      # --- ECR push (OIDC 임시 자격증명) -------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & push
        run: |
          REGISTRY=${{ steps.ecr.outputs.registry }}
          docker tag $ECR_REPO:${{ github.sha }} $REGISTRY/$ECR_REPO:${{ github.sha }}
          docker tag $ECR_REPO:${{ github.sha }} $REGISTRY/$ECR_REPO:latest
          docker push $REGISTRY/$ECR_REPO:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPO:latest
          echo "pushed: $REGISTRY/$ECR_REPO:{${{ github.sha }}, latest}"
          echo "이후 흐름: Image Updater가 latest 갱신 감지 → gitops write-back → ArgoCD 배포
