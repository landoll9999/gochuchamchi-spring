# 로컬 도커용 설정. /app/config/application.yml 로 마운트된다.
# ENTRYPOINT 가 --spring.config.location 으로 이 파일만 쓰므로 jar 안의 yml 은 안 읽힌다 → 항목이 전부 있어야 함

app:
  superadmin:
    username: ${APP_SUPERADMIN_USERNAME:}
cloud:
  aws:
    s3:
      bucket: ${CLOUD_AWS_S3_BUCKET:gochuchamchi-images}
    region:
      static: ${CLOUD_AWS_REGION_STATIC:ap-northeast-2}
spring:
  datasource:
    url: jdbc:mariadb://db:3306/gochuchamchi?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: localdev
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
  session:
    store-type: redis
    redis:
      namespace: gochuchamchi:session
    timeout: 3600
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.gochuchamchi.dto
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 3600
logging:
  level:
    com.gochuchamchi: DEBUG
    org.mybatis: DEBUG
