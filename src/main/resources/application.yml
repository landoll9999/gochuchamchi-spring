app:
  superadmin:
    # 기동 시 이 아이디를 superadmin 으로 승격 (비우면 동작 안 함, 계정 생성은 안 하므로 회원가입이 먼저)
    # 컨테이너는 외부 yml 을 쓰므로 이 파일은 운영에서 안 읽힘 → 운영은 환경변수 APP_SUPERADMIN_USERNAME
    username: ${SUPERADMIN_USERNAME:}
cloud:
  aws:
    s3:
      bucket: ${CLOUD_AWS_S3_BUCKET:gochuchamchi-images}
      public-base-url: ${CLOUD_AWS_S3_PUBLIC_BASE_URL:}
    region:
      static: ${CLOUD_AWS_REGION_STATIC:ap-northeast-2}
spring:
  profiles:
    default: web
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/gochuchamchi?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  session:
    store-type: redis
    redis:
      namespace: ${SPRING_SESSION_REDIS_NAMESPACE:gochuchamchi:web-session}
    timeout: 3600
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.gochuchamchi.dto
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    variables:
      userTable: web_users
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 3600
      cookie:
        name: ${SESSION_COOKIE_NAME:WEBSESSION}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
logging:
  level:
    com.gochuchamchi: ${APP_LOG_LEVEL:INFO}
    org.mybatis: ${MYBATIS_LOG_LEVEL:WARN}
    APPLICATION_SECURITY_JSON: INFO
---
spring:
  config:
    activate:
      on-profile: admin
mybatis:
  configuration:
    variables:
      userTable: users
