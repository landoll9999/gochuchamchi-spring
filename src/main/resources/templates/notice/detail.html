<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${notice.title + ' — gochuchamchi'}">Notice — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .notice-wrap{padding:56px 64px;flex:1;max-width:800px;}
    .detail-header{border-bottom:0.5px solid #1a1a1a;padding-bottom:24px;margin-bottom:36px;}
    .detail-title{font-size:20px;font-weight:400;color:#fff;margin-bottom:14px;line-height:1.4;}
    .pin-badge{display:inline-block;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#000;background:#fff;padding:2px 7px;margin-right:10px;vertical-align:middle;}
    .detail-meta{display:flex;gap:24px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#444;}
    .detail-body{font-size:13px;line-height:2;color:#888;white-space:pre-line;word-break:keep-all;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="notice-wrap">
    <div class="detail-header">
      <div class="detail-title">
        <span th:if="${notice.pinned}" class="pin-badge">공지</span>
        <span th:text="${notice.title}"></span>
      </div>
      <div class="detail-meta">
        <span th:text="${notice.author}"></span>
        <span th:text="${#temporals.format(notice.createdAt,'yyyy-MM-dd')}"></span>
        <span th:text="'Views ' + ${notice.views}"></span>
      </div>
    </div>
    <div class="detail-body" th:text="${notice.content}"></div>
    <a th:href="@{/notice}" class="txt-link" style="display:inline-block;margin-top:48px;">← 목록으로</a>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
