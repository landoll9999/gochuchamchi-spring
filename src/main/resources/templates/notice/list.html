<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice — gochuchamchi</title>
  <th:block th:replace="~{layout/head :: fonts}"></th:block>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .notice-wrap{padding:64px 80px;flex:1;}
    .notice-table{width:100%;border-collapse:collapse;margin-top:0;}
    .notice-table thead tr{border-top:2px solid #111;border-bottom:1px solid #e0e0e0;}
    .notice-table thead th{padding:16px 14px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#aaa;font-weight:500;text-align:center;}
    .notice-table thead th.title-col{text-align:left;}
    .notice-table tbody tr{border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.15s;}
    .notice-table tbody tr:hover{background:#f8f8f8;}
    .notice-table tbody td{padding:18px 14px;font-size:14px;color:#888;vertical-align:middle;text-align:center;}
    .notice-table tbody td.title-col{text-align:left;color:#333;}
    .notice-table tbody tr:hover td.title-col{color:#111;}
    .pin-row{background:#fafafa;}
    .pin-badge{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:#111;padding:3px 8px;margin-right:10px;vertical-align:middle;}
    .search-bar{display:flex;align-items:center;gap:10px;margin-top:36px;padding-top:24px;border-top:1px solid #f0f0f0;flex-wrap:wrap;}
    .search-select{background:#fff;border:1px solid #e0e0e0;color:#555;font-size:13px;padding:10px 14px;outline:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
    .search-input{flex:1;min-width:200px;max-width:320px;background:#fff;border:1px solid #e0e0e0;color:#111;font-size:14px;padding:10px 16px;outline:none;font-family:'Noto Sans KR',sans-serif;}
    .search-input::placeholder{color:#ccc;}
    .search-btn{padding:10px 24px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:#111;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="notice-wrap">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:52px;">
      <div class="page-title" style="margin-bottom:0;">
        공지사항 <span class="title-main">Notice</span>
      </div>
      <a sec:authorize="hasAnyRole('ADMIN','SUPERADMIN')"
         th:href="@{/admin/notices/new}" class="btn btn-fill">+ 공지사항 등록</a>
    </div>

    <table class="notice-table">
      <thead>
        <tr>
          <th style="width:80px;">번호</th>
          <th class="title-col">제목</th>
          <th style="width:130px;">작성자</th>
          <th style="width:130px;">작성일</th>
          <th style="width:80px;">조회</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(notices)}">
          <td colspan="5" style="padding:80px;color:#ccc;font-size:13px;letter-spacing:2px;">등록된 공지사항이 없습니다.</td>
        </tr>
        <tr th:each="n, st : ${notices}"
            th:classappend="${n.pinned} ? 'pin-row'"
            th:onclick="|location.href='@{/notice/}' + ${n.id}|">
          <td style="font-size:13px;color:#ccc;">
            <span th:if="${n.pinned}">—</span>
            <span th:unless="${n.pinned}" th:text="${totalCount - (currentPage-1)*15 - st.index}"></span>
          </td>
          <td class="title-col">
            <span th:if="${n.pinned}" class="pin-badge">공지</span>
            <span th:text="${n.title}"></span>
          </td>
          <td th:text="${n.author}"></td>
          <td th:text="${n.createdAtStr}"></td>
          <td th:text="${n.views}"></td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" th:if="${totalPages > 1}">
      <a th:if="${currentPage > 1}" th:href="@{/notice(page=${currentPage-1},keyword=${keyword},type=${type},period=${period})}">&#8249;</a>
      <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
        <span th:if="${i == currentPage}" class="current" th:text="${i}"></span>
        <a th:unless="${i == currentPage}" th:href="@{/notice(page=${i},keyword=${keyword},type=${type},period=${period})}" th:text="${i}"></a>
      </th:block>
      <a th:if="${currentPage < totalPages}" th:href="@{/notice(page=${currentPage+1},keyword=${keyword},type=${type},period=${period})}">&#8250;</a>
    </div>

    <div class="search-bar">
      <form th:action="@{/notice}" method="get" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <select name="period" class="search-select">
          <option value="week" th:selected="${period=='week'}">일주일</option>
          <option value="month" th:selected="${period=='month'}">한달</option>
          <option value="year" th:selected="${period=='year'}">1년</option>
          <option value="all" th:selected="${period=='all'}">전체</option>
        </select>
        <select name="type" class="search-select">
          <option value="title" th:selected="${type=='title'}">제목</option>
          <option value="content" th:selected="${type=='content'}">내용</option>
          <option value="both" th:selected="${type=='both'}">제목+내용</option>
        </select>
        <input type="text" name="keyword" class="search-input" placeholder="검색어를 입력하세요" th:value="${keyword}">
        <button type="submit" class="search-btn">검색</button>
      </form>
    </div>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
