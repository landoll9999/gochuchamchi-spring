<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="sidebar">
  <!-- 햄버거 버튼 -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
<!-- 오버레이 -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside id="sidebar">
  <div class="sidebar-brand">
    <a th:href="@{/}">gochuchamchi</a>
  </div>
  <nav>
    <div class="nav-item"><a th:href="@{/shop}">New Arrivals</a></div>
    <div class="nav-divider"></div>
    <div class="nav-item" onclick="toggleNav(this)">
      <span>Tops &amp; Shirts <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg></span>
      <div class="sub-menu">
        <a th:href="@{/shop(category='tees')}">Tees</a>
        <a th:href="@{/shop(category='button-ups')}">Button-ups</a>
        <a th:href="@{/shop(category='jerseys')}">Jerseys</a>
        <a th:href="@{/shop(category='tops')}">All</a>
      </div>
    </div>
    <div class="nav-item" onclick="toggleNav(this)">
      <span>Sweats <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg></span>
      <div class="sub-menu">
        <a th:href="@{/shop(category='hoodies')}">Hoodies</a>
        <a th:href="@{/shop(category='zip-ups')}">Zip-ups</a>
        <a th:href="@{/shop(category='sweatpants')}">Sweatpants</a>
        <a th:href="@{/shop(category='sweats')}">All</a>
      </div>
    </div>
    <div class="nav-item" onclick="toggleNav(this)">
      <span>Bottoms <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg></span>
      <div class="sub-menu">
        <a th:href="@{/shop(category='pants')}">Pants</a>
        <a th:href="@{/shop(category='denim')}">Denim</a>
        <a th:href="@{/shop(category='bottoms')}">All</a>
      </div>
    </div>
    <div class="nav-item" onclick="toggleNav(this)">
      <span>Outerwear <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg></span>
      <div class="sub-menu">
        <a th:href="@{/shop(category='jackets')}">Jackets</a>
        <a th:href="@{/shop(category='coats')}">Coats</a>
        <a th:href="@{/shop(category='outerwear')}">All</a>
      </div>
    </div>
    <div class="nav-item" onclick="toggleNav(this)">
      <span>Headwear <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg></span>
      <div class="sub-menu">
        <a th:href="@{/shop(category='caps')}">Caps</a>
        <a th:href="@{/shop(category='beanies')}">Beanies</a>
        <a th:href="@{/shop(category='headwear')}">All</a>
      </div>
    </div>
    <div class="nav-item" onclick="toggleNav(this)">
      <span>Accessories <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg></span>
      <div class="sub-menu">
        <a th:href="@{/shop(category='bags')}">Bags</a>
        <a th:href="@{/shop(category='belts')}">Belts</a>
        <a th:href="@{/shop(category='accessories')}">All</a>
      </div>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item"><a href="#">Lookbook</a></div>
    <div class="nav-item"><a th:href="@{/notice}">Notice</a></div>
    <div class="nav-item"><a href="#">About</a></div>
    <div class="nav-item"><a href="#">Support</a></div>

    <!-- 관리자 메뉴 -->
    <div sec:authorize="hasAnyRole('ADMIN','SUPERADMIN')">
      <div class="nav-divider"></div>
      <div class="nav-item"><a th:href="@{/admin}" style="color:#e74c3c;">Admin</a></div>
    </div>
  </nav>
</aside>

<!-- 계정 메뉴(Login / Logout / Mypage)는 layout/topbar.html 로 옮겼다.
     예전에는 여기에 .corner-auth 라는 테두리 있는 사각형 패널로 떠 있었다. -->
<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const hamburger = document.getElementById('hamburger');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
  hamburger.classList.toggle('active');
}
</script>
</th:block>
</body>
</html>
