<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Shop — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .shop-wrap{padding:40px 48px;flex:1;}
    .shop-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;padding-bottom:14px;border-bottom:0.5px solid #1a1a1a;}
    .total-count{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#444;}
    .total-count strong{color:#fff;}
    .sort-bar{display:flex;margin-bottom:36px;padding-bottom:14px;border-bottom:0.5px solid #111;}
    .sort-bar a{font-size:10px;letter-spacing:1px;color:#444;text-decoration:none;padding:0 14px;border-right:0.5px solid #1a1a1a;transition:color 0.15s;white-space:nowrap;}
    .sort-bar a:first-child{padding-left:0;}
    .sort-bar a:last-child{border-right:none;}
    .sort-bar a:hover,.sort-bar a.active{color:#fff;}
    .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:48px 24px;}
    .product-card{cursor:pointer;}
    .product-thumb{aspect-ratio:3/4;background:#0d0d0d;margin-bottom:12px;overflow:hidden;position:relative;}
    .product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s ease;filter:grayscale(15%);}
    .product-card:hover .product-thumb img{transform:scale(1.04);}
    .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#222;}
    .badge-new{position:absolute;top:10px;left:10px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;background:#fff;color:#000;padding:3px 7px;}
    .wish-btn{position:absolute;bottom:10px;right:10px;width:28px;height:28px;background:rgba(0,0,0,0.5);border:0.5px solid #333;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.15s;}
    .wish-btn:hover{border-color:#fff;}
    .wish-btn svg{width:14px;height:14px;fill:none;stroke:#888;stroke-width:1.5;transition:stroke 0.15s;}
    .wish-btn:hover svg{stroke:#fff;}
    .product-brand{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:5px;}
    .product-name{font-size:12px;color:#ccc;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.15s;}
    .product-card:hover .product-name{color:#fff;}
    .product-price{font-size:13px;color:#fff;}
    .empty-state{grid-column:1/-1;padding:80px 0;text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#333;}
    .pagination{display:flex;gap:4px;margin-top:64px;padding-top:28px;border-top:0.5px solid #1a1a1a;}
    .pagination a,.pagination span{display:inline-block;padding:8px 14px;font-size:11px;color:#444;text-decoration:none;transition:color 0.15s;}
    .pagination a:hover{color:#fff;}
    .pagination .current{color:#fff;}
    .fab{position:fixed;bottom:40px;right:40px;padding:14px 28px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#000;background:#fff;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:300;transition:all 0.2s;z-index:50;}
    .fab:hover{background:#000;color:#fff;border:0.5px solid #fff;}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;}
    .overlay.open{display:flex;}
    .modal{background:#0a0a0a;border:0.5px solid #2a2a2a;width:560px;max-height:85vh;overflow-y:auto;padding:48px;position:relative;}
    .modal::-webkit-scrollbar{width:0;}
    .modal-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#444;font-size:20px;cursor:pointer;transition:color 0.15s;}
    .modal-close:hover{color:#fff;}
    .modal-title{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#444;margin-bottom:36px;}
    .modal-title span{display:block;font-family:'Noto Sans KR',sans-serif;font-size:24px;font-weight:400;color:#fff;margin-top:6px;}
    .mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;}
    .mfg{margin-bottom:22px;}
    .mfg label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:8px;}
    .mf{width:100%;background:transparent;border:none;border-bottom:0.5px solid #2a2a2a;padding:10px 0;font-size:13px;color:#fff;font-family:'Noto Sans KR',sans-serif;font-weight:300;outline:none;transition:border-color 0.2s;}
    .mf:focus{border-bottom-color:#fff;}
    .mf::placeholder{color:#333;}
    .modal-submit{width:100%;padding:13px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#000;background:#fff;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:300;margin-top:28px;transition:all 0.2s;}
    .modal-submit:hover{background:transparent;color:#fff;border:0.5px solid #fff;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="shop-wrap">
    <div class="shop-header">
      <span class="total-count">TOTAL <strong th:text="${totalCount}">0</strong> PRODUCT</span>
    </div>
    <div class="sort-bar">
      <a th:href="@{/shop(sort='newest')}"    th:classappend="${sort=='newest'}    ?'active'">신상품</a>
      <a th:href="@{/shop(sort='name')}"      th:classappend="${sort=='name'}      ?'active'">상품명</a>
      <a th:href="@{/shop(sort='price_asc')}" th:classappend="${sort=='price_asc'} ?'active'">낮은가격</a>
      <a th:href="@{/shop(sort='price_desc')}"th:classappend="${sort=='price_desc'}?'active'">높은가격</a>
      <a th:href="@{/shop(sort='brand')}"     th:classappend="${sort=='brand'}     ?'active'">브랜드</a>
      <a th:href="@{/shop(sort='popular')}"   th:classappend="${sort=='popular'}   ?'active'">인기상품</a>
    </div>
    <div class="product-grid">
      <div class="empty-state" th:if="${#lists.isEmpty(products)}">No products found</div>
      <div class="product-card" th:each="p : ${products}"
           th:onclick="|location.href='@{/shop/{id}(id=${p.id})}'|">
        <div class="product-thumb">
          <img th:if="${p.image != null}" th:src="${p.image}" th:alt="${p.name}">
          <div class="no-img" th:unless="${p.image != null}">No Image</div>
          <span class="badge-new" th:if="${p.newItem}">New</span>
          <div class="wish-btn" onclick="event.stopPropagation();toggleWish(this)">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
        </div>
        <div class="product-brand" th:text="${p.brand}"></div>
        <div class="product-name" th:text="${p.name}"></div>
        <div class="product-price" th:text="${#numbers.formatInteger(p.price,1,'COMMA') + ' won'}"></div>
      </div>
    </div>
    <div class="pagination" th:if="${totalPages > 1}">
      <th:block th:each="i : ${#numbers.sequence(1,totalPages)}">
        <span class="current" th:if="${i == currentPage}" th:text="${i}"></span>
        <a th:unless="${i == currentPage}" th:href="@{/shop(page=${i},sort=${sort})}" th:text="${i}"></a>
      </th:block>
    </div>
  </div>
</div>

<!-- 판매자 전용 FAB -->
<sec:authorize access="hasRole('SELLER')">
  <button class="fab" onclick="openModal()">+ 상품 등록</button>
  <div class="overlay" id="productModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">New Product <span>상품 등록</span></div>
      <form th:action="@{/shop/register}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mrow">
          <div class="mfg"><label>브랜드 *</label><input type="text" name="brand" class="mf" placeholder="브랜드명" required></div>
          <div class="mfg"><label>상품명 *</label><input type="text" name="name" class="mf" placeholder="상품명" required></div>
        </div>
        <div class="mrow">
          <div class="mfg">
            <label>카테고리 *</label>
            <select name="category" class="mf" required>
              <option value="">선택</option>
              <option value="tops">Tops &amp; Shirts</option>
              <option value="sweats">Sweats</option>
              <option value="bottoms">Bottoms</option>
              <option value="outerwear">Outerwear</option>
              <option value="headwear">Headwear</option>
              <option value="accessories">Accessories</option>
            </select>
          </div>
          <div class="mfg"><label>가격 (원) *</label><input type="number" name="price" class="mf" placeholder="0" min="0" required></div>
        </div>
        <div class="mfg"><label>재고 수량</label><input type="number" name="stock" class="mf" placeholder="0" min="0" value="0"></div>
        <div class="mfg">
          <label>미리보기 사진 *</label>
          <input type="file" name="imageFile" accept="image/*" style="font-size:12px;color:#555;padding:10px 0;width:100%;cursor:pointer;" onchange="previewImg(this)">
          <div id="imgPreview" style="display:none;margin-top:12px;"><img id="previewImg" style="width:100%;max-height:200px;object-fit:cover;filter:grayscale(15%);"></div>
        </div>
        <div class="mfg"><label>상품 설명</label><textarea name="description" class="mf" rows="3" style="resize:none;padding-top:10px;" placeholder="상품 설명을 입력해주세요."></textarea></div>
        <button type="submit" class="modal-submit">등록하기</button>
      </form>
    </div>
  </div>
</sec:authorize>

<script th:src="@{/js/common.js}"></script>
<script>
function openModal(){document.getElementById('productModal').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('productModal').classList.remove('open');document.body.style.overflow='';}
function previewImg(input){if(input.files&&input.files[0]){const r=new FileReader();r.onload=e=>{document.getElementById('previewImg').src=e.target.result;document.getElementById('imgPreview').style.display='block';};r.readAsDataURL(input.files[0]);}}
function toggleWish(btn){const s=btn.querySelector('svg');const f=s.style.fill==='rgb(255, 255, 255)';s.style.fill=f?'none':'#fff';s.style.stroke=f?'#888':'#fff';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
