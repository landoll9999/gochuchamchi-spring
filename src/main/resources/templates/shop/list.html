<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — gochuchamchi</title>
  <th:block th:replace="~{layout/head :: fonts}"></th:block>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .shop-wrap{padding:48px 64px;flex:1;}
    .shop-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:16px;border-bottom:2px solid #111;}
    .shop-title{font-family:'Permanent Marker','Noto Sans KR',cursive;font-size:28px;color:#111;}
    .total-count{font-size:13px;color:#aaa;letter-spacing:1px;}
    .total-count strong{color:#111;font-weight:500;}
    /* 정렬 바: 좌측에 현재 분류, 우측에 정렬 드롭다운 (쇼핑몰 상품 목록의 일반적인 배치) */
    .sort-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;gap:16px;}
    .sort-scope{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#aaa;}
    .sort-scope strong{color:#111;font-weight:500;}
    .sort-field{display:flex;align-items:center;gap:10px;margin-left:auto;}
    .sort-field label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ccc;}
    .sort-select{appearance:none;background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpolyline points='1,1 5,5 9,1' fill='none' stroke='%23111' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat right 14px center/10px 6px;
      border:1px solid #e0e0e0;color:#111;font-size:13px;font-family:'Noto Sans KR',sans-serif;padding:10px 38px 10px 16px;cursor:pointer;outline:none;transition:border-color 0.15s;}
    .sort-select:hover,.sort-select:focus{border-color:#111;}
    .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:52px 28px;}
    .product-card{cursor:pointer;}
    .product-thumb{aspect-ratio:3/4;background:#f5f5f5;margin-bottom:14px;overflow:hidden;position:relative;}
    .product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s ease;}
    .product-card:hover .product-thumb img{transform:scale(1.04);}
    .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#ccc;}
    .badge-new{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#111;color:#fff;padding:4px 8px;}
    .wish-btn{position:absolute;bottom:12px;right:12px;width:32px;height:32px;background:rgba(255,255,255,0.9);border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.15s;}
    .wish-btn:hover{border-color:#111;}
    .wish-btn svg{width:15px;height:15px;fill:none;stroke:#aaa;stroke-width:1.5;}
    .product-brand{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:6px;}
    .product-name{font-size:14px;color:#333;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.15s;}
    .product-card:hover .product-name{color:#111;}
    .product-price{font-size:15px;color:#111;font-weight:500;}
    .empty-state{grid-column:1/-1;padding:100px 0;text-align:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#ccc;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="shop-wrap">
    <div class="shop-header">
      <div class="shop-title">Shop</div>
      <div style="display:flex;align-items:center;gap:24px;">
        <div class="total-count">TOTAL <strong th:text="${totalCount}">0</strong> ITEMS</div>
        <a sec:authorize="hasAnyRole('ADMIN','SUPERADMIN','SELLER')"
           th:href="@{/shop/register-form}" class="btn btn-fill">+ 상품 등록</a>
      </div>
    </div>
    <div class="sort-bar">
      <div class="sort-scope">
        <span th:if="${category == null or category == ''}">All Items</span>
        <strong th:unless="${category == null or category == ''}" th:text="${category}"></strong>
      </div>
      <div class="sort-field">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect" class="sort-select" onchange="applySort(this.value)">
          <option value="newest"     th:selected="${sort=='newest'}">신상품순</option>
          <option value="views_desc" th:selected="${sort=='views_desc'}">인기순 (조회수 높은순)</option>
          <option value="views_asc"  th:selected="${sort=='views_asc'}">조회수 낮은순</option>
          <option value="price_asc"  th:selected="${sort=='price_asc'}">낮은 가격순</option>
          <option value="price_desc" th:selected="${sort=='price_desc'}">높은 가격순</option>
          <option value="name"       th:selected="${sort=='name'}">상품명순</option>
          <option value="brand"      th:selected="${sort=='brand'}">브랜드순</option>
        </select>
      </div>
    </div>

    <div class="product-grid">
      <div class="empty-state" th:if="${#lists.isEmpty(products)}">등록된 상품이 없습니다.</div>
      <div class="product-card" th:each="p : ${products}" th:onclick="|location.href='@{/shop/}' + ${p.id}|">
        <div class="product-thumb">
          <img th:if="${p.image != null}" th:src="${@s3Service.publicUrl(p.image)}" th:alt="${p.name}">
          <div class="no-img" th:unless="${p.image != null}">No Image</div>
          <span th:if="${p.newItem}" class="badge-new">New</span>
          <div class="wish-btn" onclick="event.stopPropagation();toggleWish(this)">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
        </div>
        <div class="product-brand" th:text="${p.brand}"></div>
        <div class="product-name" th:text="${p.name}"></div>
        <div class="product-price"><span th:text="${#numbers.formatInteger(p.price,0,'COMMA')}"></span> 원</div>
      </div>
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
      <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
        <span th:if="${i == currentPage}" class="current" th:text="${i}"></span>
        <a th:unless="${i == currentPage}" th:href="@{/shop(page=${i},sort=${sort},category=${category})}" th:text="${i}"></a>
      </th:block>
    </div>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
// 정렬을 바꿀 때 현재 주소의 다른 조건(category 등)은 유지하고 페이지만 1로 되돌린다.
const SHOP_URL = /*[[@{/shop}]]*/ '/shop';
function applySort(value){
  const params = new URLSearchParams(window.location.search);
  params.set('sort', value);
  params.delete('page');
  location.href = SHOP_URL + '?' + params.toString();
}
function toggleWish(btn){const s=btn.querySelector('svg');const f=s.style.fill==='rgb(17, 17, 17)';s.style.fill=f?'none':'#111';s.style.stroke=f?'#aaa':'#111';}
</script>
</body>
</html>
