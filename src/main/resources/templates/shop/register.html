<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록 — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="page-wrap" style="max-width:720px;">
    <div class="page-title">New Product <span class="title-main">상품 등록</span></div>
    <form th:action="@{/shop/register}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="row-2">
        <div class="form-group">
          <label>브랜드 *</label>
          <input type="text" name="brand" class="form-control" placeholder="브랜드명" required>
        </div>
        <div class="form-group">
          <label>상품명 *</label>
          <input type="text" name="name" class="form-control" placeholder="상품명" required>
        </div>
      </div>
      <div class="row-2">
        <div class="form-group">
          <label>카테고리 *</label>
          <select name="category" class="form-control" required style="cursor:pointer;">
            <option value="">선택</option>
            <option value="tops">Tops &amp; Shirts</option>
            <option value="sweats">Sweats</option>
            <option value="bottoms">Bottoms</option>
            <option value="outerwear">Outerwear</option>
            <option value="headwear">Headwear</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>
        <div class="form-group">
          <label>가격 (원) *</label>
          <input type="number" name="price" class="form-control" placeholder="0" min="0" required>
        </div>
      </div>
      <div class="form-group">
        <label>재고 수량</label>
        <input type="number" name="stock" class="form-control" value="0" min="0">
      </div>
      <div class="form-group">
        <label>상품 이미지</label>
        <input type="file" name="imageFile" accept="image/*" class="form-control" style="cursor:pointer;"
               onchange="previewImg(this)">
        <div id="imgPreview" style="display:none;margin-top:12px;">
          <img id="previewImg" style="max-width:200px;max-height:200px;object-fit:cover;border:1px solid #e0e0e0;">
        </div>
      </div>
      <div class="form-group">
        <label>상품 설명</label>
        <textarea name="description" class="form-control" rows="4"
                  style="resize:vertical;padding-top:12px;" placeholder="상품 설명을 입력해주세요."></textarea>
      </div>
      <div class="divider"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <button type="submit" class="btn btn-fill">등록하기</button>
        <a th:href="@{/shop}" class="txt-link">← 취소</a>
      </div>
    </form>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
<script>
function previewImg(input){
  if(input.files && input.files[0]){
    const r = new FileReader();
    r.onload = e => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('imgPreview').style.display = 'block';
    };
    r.readAsDataURL(input.files[0]);
  }
}
</script>
</body>
</html>
