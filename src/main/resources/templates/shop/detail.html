<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${product.name} + ' — gochuchamchi'">Product — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .product-wrap{display:flex;gap:72px;padding:56px 64px;flex:1;}
    .img-section{width:460px;min-width:460px;}
    .main-img{width:100%;aspect-ratio:3/4;background:#f5f5f5;position:relative;overflow:hidden;margin-bottom:14px;}
    .main-img img{width:100%;height:100%;object-fit:cover;}
    .no-img-main{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ccc;}
    .badge-new{position:absolute;top:16px;left:16px;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#111;color:#fff;padding:4px 9px;}
    .thumb-list{display:flex;gap:10px;}
    .thumb{width:84px;height:84px;background:#f5f5f5;cursor:pointer;overflow:hidden;border:2px solid transparent;transition:border-color 0.15s;flex-shrink:0;}
    .thumb.active{border-color:#111;}
    .thumb img{width:100%;height:100%;object-fit:cover;}
    .info-section{flex:1;padding-top:8px;}
    .breadcrumb{font-size:12px;color:#aaa;margin-bottom:28px;display:flex;align-items:center;gap:8px;}
    .breadcrumb a{color:#aaa;text-decoration:none;transition:color 0.15s;}
    .breadcrumb a:hover{color:#111;}
    .product-brand{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#aaa;margin-bottom:12px;}
    .product-name{font-size:26px;font-weight:500;color:#111;line-height:1.3;margin-bottom:24px;}
    .product-price{font-size:24px;font-weight:500;color:#111;margin-bottom:36px;padding-bottom:36px;border-bottom:1px solid #f0f0f0;}
    .wish-btn{display:flex;align-items:center;gap:10px;background:transparent;border:none;cursor:pointer;font-size:13px;color:#aaa;transition:color 0.15s;padding:0;margin-bottom:32px;}
    .wish-btn svg{width:18px;height:18px;fill:none;stroke:#aaa;stroke-width:1.5;transition:all 0.15s;}
    .wish-btn:hover{color:#111;}
    .wish-btn:hover svg{stroke:#111;}
    .wish-btn.active{color:#111;}
    .wish-btn.active svg{fill:#111;stroke:#111;}
    .section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:14px;font-weight:500;}
    .size-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px;}
    .size-btn{min-width:56px;padding:11px 16px;font-size:13px;color:#aaa;border:1.5px solid #e0e0e0;background:transparent;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;text-align:center;}
    .size-btn:hover:not(.sold-out){color:#111;border-color:#111;}
    .size-btn.active{color:#fff;background:#111;border-color:#111;}
    .size-btn.sold-out{color:#ddd;border-color:#f0f0f0;cursor:not-allowed;text-decoration:line-through;}
    .qty-row{display:flex;align-items:center;margin-bottom:32px;}
    .qty-btn{width:40px;height:40px;background:transparent;border:1.5px solid #e0e0e0;color:#555;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
    .qty-btn:hover{border-color:#111;color:#111;}
    .qty-display{width:56px;height:40px;border-top:1.5px solid #e0e0e0;border-bottom:1.5px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#111;}
    .selected-summary{background:#fafafa;border:1px solid #f0f0f0;padding:18px 22px;margin-bottom:32px;font-size:13px;color:#888;line-height:1.8;}
    .selected-summary strong{color:#333;font-weight:500;}
    .summary-price{float:right;color:#111;font-weight:500;font-size:15px;}
    .btn-group{display:flex;gap:12px;margin-bottom:36px;}
    .btn-cart{flex:1;padding:16px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#111;border:1.5px solid #111;background:transparent;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s;}
    .btn-cart:hover{background:#111;color:#fff;}
    .btn-buy{flex:1;padding:16px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#fff;border:1.5px solid #111;background:#111;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s;}
    .btn-buy:hover{background:transparent;color:#111;}
    .delivery-info{font-size:13px;color:#888;line-height:2.2;padding-top:24px;border-top:1px solid #f0f0f0;}
    .di-row{display:flex;gap:20px;}
    .di-label{width:90px;color:#bbb;flex-shrink:0;font-size:12px;letter-spacing:1px;}
    .detail-section{padding:0 64px 80px;}
    .detail-tabs{display:flex;border-bottom:1px solid #e0e0e0;margin-bottom:52px;}
    .detail-tab{padding:18px 36px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;margin-bottom:-1px;}
    .detail-tab.active{color:#111;border-bottom-color:#111;}
    .tab-content{display:none;}
    .tab-content.active{display:block;}
    .desc-body{font-size:15px;line-height:2.2;color:#666;max-width:640px;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>

  <div class="product-wrap">
    <div class="img-section">
      <div class="main-img">
        <img th:if="${product.image != null}" th:src="${product.image}" th:alt="${product.name}" id="mainImg">
        <div class="no-img-main" th:unless="${product.image != null}">No Image</div>
        <span th:if="${product.newItem}" class="badge-new">New</span>
      </div>
      <div class="thumb-list">
        <div th:if="${product.images != null}" th:each="img : ${product.images}"
             class="thumb" th:attr="data-src=${img}" onclick="switchImg(this)">
          <img th:src="${img}" alt="이미지">
        </div>
        <div th:unless="${product.images != null}" class="thumb active">
          <div class="no-img-main" style="font-size:9px;">1</div>
        </div>
      </div>
    </div>

    <div class="info-section">
      <div class="breadcrumb">
        <a th:href="@{/shop}">Shop</a>
        <span>›</span>
        <a th:href="@{/shop(category=${product.category})}" th:text="${product.category}"></a>
        <span>›</span>
        <span style="color:#555;" th:text="${product.name}"></span>
      </div>
      <div class="product-brand" th:text="${product.brand}"></div>
      <div class="product-name" th:text="${product.name}"></div>
      <div class="product-price"><span th:text="${#numbers.formatInteger(product.price,0,'COMMA')}"></span> 원</div>

      <button class="wish-btn" id="wishBtn" onclick="toggleWish()">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="wishText">위시리스트에 추가</span>
      </button>

      <div class="section-label">사이즈 선택</div>
      <div class="size-group">
        <span th:if="${product.sizes == null or #lists.isEmpty(product.sizes)}"
              style="font-size:13px;color:#ccc;letter-spacing:1px;">사이즈 정보 없음</span>
        <button th:each="size : ${product.sizes}"
                th:classappend="${size.soldOut} ? 'sold-out'"
                class="size-btn"
                th:disabled="${size.soldOut}"
                th:text="${size.name}"
                onclick="selectSize(this)"></button>
      </div>

      <div class="section-label">수량</div>
      <div class="qty-row" style="margin-top:12px;">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <div class="qty-display" id="qtyDisplay">1</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>

      <div class="selected-summary" id="summary">
        <strong th:text="${product.name}"></strong> / <span id="summarySize">—</span><br>
        수량 <strong id="summaryQty">1</strong>개
        <span class="summary-price" id="summaryPrice">
          <span th:text="${#numbers.formatInteger(product.price,0,'COMMA')}"></span> 원
        </span>
      </div>

      <div class="btn-group">
        <button class="btn-cart" onclick="addCart()">장바구니</button>
        <button class="btn-buy" onclick="buyNow()">바로 구매</button>
      </div>

      <div class="delivery-info">
        <div class="di-row"><div class="di-label">배송</div><div>무료배송 / 주문 후 1~3 영업일 내 발송</div></div>
        <div class="di-row"><div class="di-label">교환/반품</div><div>수령 후 7일 이내 가능</div></div>
        <div class="di-row"><div class="di-label">문의</div><div>고객센터 운영시간 내 답변 드립니다</div></div>
      </div>
    </div>
  </div>

  <div class="detail-section">
    <div class="detail-tabs">
      <div class="detail-tab active" onclick="switchTab(this,'desc')">상품 설명</div>
      <div class="detail-tab" onclick="switchTab(this,'size')">사이즈 가이드</div>
    </div>
    <div class="tab-content active" id="tab-desc">
      <div class="desc-body">
        <span th:if="${product.description != null}" th:text="${product.description}"></span>
        <span th:unless="${product.description != null}" style="color:#ccc;">상품 설명이 없습니다.</span>
      </div>
    </div>
    <div class="tab-content" id="tab-size">
      <p style="font-size:13px;color:#aaa;margin-top:20px;">사이즈 가이드 정보가 없습니다.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script th:src="@{/js/common.js}"></script>
<script th:inline="javascript">
const price = [[${product.price}]];
let qty = 1, selectedSize = null;
function selectSize(btn){document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedSize=btn.textContent.trim();document.getElementById('summarySize').textContent=selectedSize;updateSummary();}
function changeQty(d){qty=Math.max(1,Math.min(99,qty+d));document.getElementById('qtyDisplay').textContent=qty;updateSummary();}
function updateSummary(){document.getElementById('summaryQty').textContent=qty;document.getElementById('summaryPrice').textContent=(price*qty).toLocaleString()+' 원';}
function toggleWish(){const btn=document.getElementById('wishBtn'),txt=document.getElementById('wishText');btn.classList.toggle('active');txt.textContent=btn.classList.contains('active')?'위시리스트에 추가됨':'위시리스트에 추가';}
function addCart(){if(!selectedSize){showToast('사이즈를 선택해주세요.');return;}showToast('장바구니에 담겼습니다.');}
function buyNow(){if(!selectedSize){showToast('사이즈를 선택해주세요.');return;}location.href='/order';}
function switchImg(thumb){const src=thumb.dataset.src;if(document.getElementById('mainImg'))document.getElementById('mainImg').src=src;document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));thumb.classList.add('active');}
function switchTab(el,name){document.querySelectorAll('.detail-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+name).classList.add('active');}
</script>
</body>
</html>
