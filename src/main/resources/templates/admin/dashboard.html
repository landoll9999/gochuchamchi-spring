<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#f5f5f5;color:#111;font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;}
    .content{margin-left:240px;flex:1;min-height:100vh;}
    .topbar{height:60px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;}
    .topbar-title{font-size:16px;font-weight:500;color:#111;}
    .topbar-user{font-size:13px;color:#aaa;}
    .main{padding:40px;}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px;}
    .stat-card{background:#fff;border:1px solid #e0e0e0;padding:28px 32px;}
    .stat-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:12px;}
    .stat-value{font-size:36px;font-weight:500;color:#111;}
    .quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
    .quick-card{background:#fff;border:1px solid #e0e0e0;padding:28px 32px;text-decoration:none;color:#111;transition:border-color 0.15s;}
    .quick-card:hover{border-color:#111;}
    .quick-card-title{font-size:15px;font-weight:500;margin-bottom:8px;}
    .quick-card-desc{font-size:13px;color:#aaa;}
  </style>
</head>
<body>
<th:block th:replace="~{admin/layout/sidebar :: sidebar}"></th:block>
<div class="content">
  <div class="topbar">
    <div class="topbar-title">대시보드</div>
    <div class="topbar-user" sec:authentication="name">관리자</div>
  </div>
  <div class="main">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">전체 회원</div>
        <div class="stat-value" th:text="${userCount}">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">공지사항</div>
        <div class="stat-value" th:text="${noticeCount}">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">등록 상품</div>
        <div class="stat-value" th:text="${productCount}">0</div>
      </div>
    </div>

    <div class="quick-links">
      <a th:href="@{/admin/users}" class="quick-card">
        <div class="quick-card-title">회원 관리</div>
        <div class="quick-card-desc">회원 목록 조회 및 권한 변경</div>
      </a>
      <a th:href="@{/admin/notices}" class="quick-card">
        <div class="quick-card-title">공지사항 관리</div>
        <div class="quick-card-desc">공지사항 등록 · 수정 · 삭제</div>
      </a>
      <a th:href="@{/admin/products}" class="quick-card">
        <div class="quick-card-title">상품 관리</div>
        <div class="quick-card-desc">상품 목록 조회 및 삭제</div>
      </a>
    </div>
  </div>
</div>
</body>
</html>
