<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 관리 — Admin</title>
  <th:block th:replace="~{layout/head :: fonts}"></th:block>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#f5f5f5;color:#111;font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;}
    .content{margin-left:240px;flex:1;min-height:100vh;}
    .topbar{height:60px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;}
    .topbar-title{font-size:16px;font-weight:500;}
    .btn-new{padding:10px 24px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:#111;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-decoration:none;}
    .main{padding:40px;}
    .msg-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px 16px;margin-bottom:24px;font-size:13px;}
    table{width:100%;border-collapse:collapse;background:#fff;}
    thead tr{border-bottom:2px solid #111;}
    thead th{padding:14px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;font-weight:500;text-align:left;}
    tbody tr{border-bottom:1px solid #f0f0f0;}
    tbody tr:hover{background:#fafafa;}
    tbody td{padding:16px;font-size:14px;color:#555;}
    .product-img{width:48px;height:64px;object-fit:cover;background:#f5f5f5;}
    .btn-del{padding:7px 14px;font-size:12px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;background:#fee2e2;color:#dc2626;}
  </style>
</head>
<body>
<th:block th:replace="~{admin/layout/sidebar :: sidebar}"></th:block>
<div class="content">
  <div class="topbar">
    <div class="topbar-title">상품 관리</div>
    <a th:href="@{/shop/register-form}" class="btn-new">+ 상품 등록</a>
  </div>
  <div class="main">
    <div class="msg-success" th:if="${success}" th:text="${success}"></div>
    <table>
      <thead>
        <tr><th>이미지</th><th>ID</th><th>브랜드</th><th>상품명</th><th>카테고리</th><th>가격</th><th>재고</th><th>조회수</th><th>관리</th></tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(products)}">
          <td colspan="9" style="text-align:center;padding:60px;color:#ccc;">등록된 상품이 없습니다.</td>
        </tr>
        <tr th:each="p : ${products}">
          <td><img th:if="${p.image != null}" th:src="${@s3Service.publicUrl(p.image)}" class="product-img" th:alt="${p.name}">
              <div th:unless="${p.image != null}" class="product-img" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#ccc;">No Img</div></td>
          <td th:text="${p.id}"></td>
          <td th:text="${p.brand}"></td>
          <td th:text="${p.name}"></td>
          <td th:text="${p.category}"></td>
          <td th:text="${#numbers.formatInteger(p.price,0,'COMMA')} + '원'"></td>
          <td th:text="${p.stock}"></td>
          <td th:text="${p.viewCount}"></td>
          <td>
            <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn-del" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
