<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — gochuchamchi</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    body{background:#f5f6f8}.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
    .login-box{width:100%;max-width:420px;background:#fff;padding:40px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="page-title">Gochuchamchi <span class="title-main">Admin</span></div>
    <div class="msg-error" th:if="${param.error}">관리자 아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div class="msg-error" th:if="${throttledMessage}" th:text="${throttledMessage}"></div>
    <div class="msg-error" th:if="${suspendedMessage}" th:text="${suspendedMessage}"></div>
    <div class="msg-success" th:if="${param.logout}">로그아웃되었습니다.</div>
    <form th:action="@{/auth/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="form-group"><label>관리자 아이디</label><input type="text" name="username" class="form-control" required autocomplete="username"></div>
      <div class="form-group"><label>비밀번호</label><input type="password" name="password" class="form-control" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-fill btn-block" style="margin-top:28px">관리자 로그인</button>
    </form>
  </div>
</div>
</body>
</html>
