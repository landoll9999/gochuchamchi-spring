<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원 관리 — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#f5f5f5;color:#111;font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;}
    .content{margin-left:240px;flex:1;min-height:100vh;}
    .topbar{height:60px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;padding:0 40px;}
    .topbar-title{font-size:16px;font-weight:500;}
    .main{padding:40px;}
    .msg-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px 16px;margin-bottom:24px;font-size:13px;}
    table{width:100%;border-collapse:collapse;background:#fff;}
    thead tr{border-bottom:2px solid #111;}
    thead th{padding:14px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;font-weight:500;text-align:left;}
    tbody tr{border-bottom:1px solid #f0f0f0;transition:background 0.15s;}
    tbody tr:hover{background:#fafafa;}
    tbody td{padding:16px;font-size:14px;color:#555;}
    .role-badge{display:inline-block;padding:3px 10px;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-radius:2px;}
    .role-admin{background:#111;color:#fff;}
    .role-seller{background:#2563eb;color:#fff;}
    .role-user{background:#f0f0f0;color:#555;}
    .role-select{border:1px solid #e0e0e0;padding:6px 10px;font-size:13px;font-family:'Noto Sans KR',sans-serif;background:#fff;cursor:pointer;outline:none;}
    .btn-sm{padding:7px 16px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:#111;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
    .btn-sm:hover{background:#333;}
  </style>
</head>
<body>
<th:block th:replace="~{admin/layout/sidebar :: sidebar}"></th:block>
<div class="content">
  <div class="topbar"><div class="topbar-title">회원 관리</div></div>
  <div class="main">
    <div class="msg-success" th:if="${success}" th:text="${success}"></div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>아이디</th>
          <th>이름</th>
          <th>이메일</th>
          <th>전화번호</th>
          <th>가입일</th>
          <th>권한</th>
          <th>변경</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.username}"></td>
          <td th:text="${u.name}"></td>
          <td th:text="${u.email ?: '—'}"></td>
          <td th:text="${u.phone ?: '—'}"></td>
          <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'yyyy-MM-dd') : '—'}"></td>
          <td>
            <span class="role-badge"
                  th:classappend="${u.role == 'admin'} ? 'role-admin' : (${u.role == 'seller'} ? 'role-seller' : 'role-user')"
                  th:text="${u.role}"></span>
          </td>
          <td>
            <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" style="display:flex;gap:8px;align-items:center;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <select name="role" class="role-select">
                <option value="user" th:selected="${u.role == 'user'}">user</option>
                <option value="seller" th:selected="${u.role == 'seller'}">seller</option>
                <option value="admin" th:selected="${u.role == 'admin'}">admin</option>
              </select>
              <button type="submit" class="btn-sm">변경</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
