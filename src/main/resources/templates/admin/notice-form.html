<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 등록/수정 — Admin</title>
  <th:block th:replace="~{layout/head :: fonts}"></th:block>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#f5f5f5;color:#111;font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;}
    .content{margin-left:240px;flex:1;min-height:100vh;}
    .topbar{height:60px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;padding:0 40px;}
    .topbar-title{font-size:16px;font-weight:500;}
    .main{padding:40px;max-width:800px;}
    .form-group{margin-bottom:24px;}
    label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;margin-bottom:10px;font-weight:500;}
    input[type=text],textarea{width:100%;border:1px solid #e0e0e0;padding:12px 16px;font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;background:#fff;}
    input[type=text]:focus,textarea:focus{border-color:#111;}
    textarea{min-height:280px;resize:vertical;line-height:1.8;}
    .checkbox-group{display:flex;align-items:center;gap:10px;}
    .checkbox-group input{width:18px;height:18px;cursor:pointer;}
    .btn-save{padding:13px 40px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#fff;background:#111;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
    .btn-cancel{padding:13px 40px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#555;background:#f0f0f0;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-decoration:none;display:inline-block;}
  </style>
</head>
<body>
<th:block th:replace="~{admin/layout/sidebar :: sidebar}"></th:block>
<div class="content">
  <div class="topbar">
    <div class="topbar-title" th:text="${notice.id == null} ? '공지사항 등록' : '공지사항 수정'">공지사항</div>
  </div>
  <div class="main">
    <form th:action="@{/admin/notices/save}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="id" th:value="${notice.id}">
      <div class="form-group">
        <label>제목 *</label>
        <input type="text" name="title" th:value="${notice.title}" placeholder="공지사항 제목" required>
      </div>
      <div class="form-group">
        <label>내용 *</label>
        <textarea name="content" th:text="${notice.content}" placeholder="공지사항 내용" required></textarea>
      </div>
      <div class="form-group">
        <label>설정</label>
        <div class="checkbox-group">
          <input type="checkbox" name="pinned" id="pinned" value="true" th:checked="${notice.pinned}">
          <span>상단 고정 (공지사항으로 표시)</span>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:36px;">
        <button type="submit" class="btn-save">저장</button>
        <a th:href="@{/admin/notices}" class="btn-cancel">취소</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
