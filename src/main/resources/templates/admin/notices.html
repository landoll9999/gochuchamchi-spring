<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 관리 — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#f5f5f5;color:#111;font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;}
    .content{margin-left:240px;flex:1;min-height:100vh;}
    .topbar{height:60px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;}
    .topbar-title{font-size:16px;font-weight:500;}
    .main{padding:40px;}
    .msg-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px 16px;margin-bottom:24px;font-size:13px;}
    .btn-new{padding:10px 24px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:#111;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-decoration:none;}
    table{width:100%;border-collapse:collapse;background:#fff;margin-top:24px;}
    thead tr{border-bottom:2px solid #111;}
    thead th{padding:14px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#aaa;font-weight:500;text-align:left;}
    tbody tr{border-bottom:1px solid #f0f0f0;}
    tbody tr:hover{background:#fafafa;}
    tbody td{padding:16px;font-size:14px;color:#555;}
    .pin-badge{display:inline-block;font-size:10px;background:#111;color:#fff;padding:2px 7px;margin-right:8px;}
    .btn-sm{padding:7px 14px;font-size:12px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
    .btn-edit{background:#f0f0f0;color:#333;}
    .btn-del{background:#fee2e2;color:#dc2626;}
  </style>
</head>
<body>
<th:block th:replace="~{admin/layout/sidebar :: sidebar}"></th:block>
<div class="content">
  <div class="topbar">
    <div class="topbar-title">공지사항 관리</div>
    <a th:href="@{/admin/notices/new}" class="btn-new">+ 새 공지사항</a>
  </div>
  <div class="main">
    <div class="msg-success" th:if="${success}" th:text="${success}"></div>
    <table>
      <thead><tr><th>ID</th><th>제목</th><th>작성자</th><th>조회수</th><th>작성일</th><th>관리</th></tr></thead>
      <tbody>
        <tr th:each="n : ${notices}">
          <td th:text="${n.id}"></td>
          <td>
            <span th:if="${n.pinned}" class="pin-badge">공지</span>
            <span th:text="${n.title}"></span>
          </td>
          <td th:text="${n.author}"></td>
          <td th:text="${n.views}"></td>
          <td th:text="${n.createdAtStr}"></td>
          <td style="display:flex;gap:8px;">
            <a th:href="@{/admin/notices/{id}/edit(id=${n.id})}" class="btn-sm btn-edit">수정</a>
            <form th:action="@{/admin/notices/{id}/delete(id=${n.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn-sm btn-del" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
