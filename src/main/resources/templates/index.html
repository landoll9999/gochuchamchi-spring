<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    #splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.7s ease;}
    #splash .splash-logo{font-family:'Permanent Marker',cursive;font-size:72px;color:#111;margin-bottom:40px;letter-spacing:-1px;cursor:pointer;transition:opacity 0.2s;user-select:none;}
    #splash .splash-logo:hover{opacity:0.4;}
    #splash .splash-hint{margin-top:20px;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#ccc;}
    #splash.hidden{opacity:0;pointer-events:none;}
    #main{display:flex;min-height:100vh;opacity:0;transition:opacity 0.5s ease 0.2s;}
    #main.visible{opacity:1;}
    main{flex:1;position:relative;min-height:calc(100vh - 64px);overflow:hidden;background:#fff;}
    .bg-texture{position:absolute;inset:0;background-image:url('https://gochuchamchi-images.s3.ap-northeast-2.amazonaws.com/texture.png');background-size:cover;background-position:center;opacity:1;mix-blend-mode:multiply;}
  </style>
</head>
<body style="display:block;">

<div id="splash">
  <div class="splash-logo" onclick="enterSite()">gochuchamchi</div>
  <div class="splash-hint">click logo to enter</div>
</div>

<div id="main">
  <th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
  <div class="content-wrap">
    <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
    <main>
      <div class="bg-texture"></div>
    </main>
  </div>
</div>

<script th:src="@{/js/common.js}"></script>
<script>
function enterSite(){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('main').classList.add('visible');
}
</script>
</body>
</html>
