<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .register-wrap{display:flex;justify-content:center;padding:64px 40px;flex:1;}
    .register-box{width:100%;max-width:640px;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="register-wrap">
    <div class="register-box">
      <div class="page-title">Join us <span class="title-main">Register</span></div>
      <div class="msg-error" th:if="${error}" th:text="${error}"></div>
      <form th:action="@{/auth/register}" method="post" id="regForm" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
          <label>아이디 <span style="color:#e74c3c;">*</span></label>
          <input type="text" name="username" id="uid" class="form-control" placeholder="영문+숫자 6~20자" th:value="${form?.username}">
          <div class="invalid-feedback" id="e-uid">아이디는 영문+숫자 6~20자로 입력해주세요.</div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label>비밀번호 <span style="color:#e74c3c;">*</span></label>
            <input type="password" name="password" id="pw" class="form-control" placeholder="영문+숫자+특수문자 8자 이상">
            <div class="invalid-feedback" id="e-pw">8자 이상 영문+숫자+특수문자를 포함해야 합니다.</div>
          </div>
          <div class="form-group">
            <label>비밀번호 확인 <span style="color:#e74c3c;">*</span></label>
            <input type="password" name="confirmPassword" id="cpw" class="form-control" placeholder="비밀번호 재입력">
            <div class="invalid-feedback" id="e-cpw">비밀번호가 일치하지 않습니다.</div>
          </div>
        </div>
        <div class="form-group">
          <label>이메일 <span style="color:#aaa;font-size:11px;">(본인확인용)</span></label>
          <input type="email" name="email" id="email" class="form-control" placeholder="example@email.com" th:value="${form?.email}">
          <div class="invalid-feedback" id="e-email">유효한 이메일 형식을 입력해주세요.</div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label>이름 <span style="color:#e74c3c;">*</span></label>
            <input type="text" name="name" id="nm" class="form-control" placeholder="실명 입력" th:value="${form?.name}">
            <div class="invalid-feedback" id="e-nm">이름을 입력해주세요.</div>
          </div>
          <div class="form-group">
            <label>생년월일 <span style="color:#e74c3c;">*</span> <span style="color:#aaa;font-size:11px;">8자리</span></label>
            <input type="text" name="birthdate" id="bd" class="form-control" placeholder="YYYYMMDD" maxlength="8" th:value="${form?.birthdate}">
            <div class="invalid-feedback" id="e-bd">생년월일 8자리를 입력해주세요. (예: 19900101)</div>
          </div>
        </div>
        <div class="form-group">
          <label>휴대전화번호 <span style="color:#e74c3c;">*</span></label>
          <input type="tel" name="phone" id="ph" class="form-control" placeholder="- 없이 숫자만 입력" th:value="${form?.phone}">
          <div class="invalid-feedback" id="e-ph">올바른 휴대전화번호를 입력해주세요.</div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label>성별 <span style="color:#e74c3c;">*</span></label>
            <div class="toggle-group" id="gGrp">
              <button type="button" class="toggle-btn active" data-v="M" onclick="selT('gGrp','gender',this)">남자</button>
              <button type="button" class="toggle-btn" data-v="F" onclick="selT('gGrp','gender',this)">여자</button>
            </div>
            <input type="hidden" name="gender" id="gender" value="M">
          </div>
          <div class="form-group">
            <label>국적 <span style="color:#e74c3c;">*</span></label>
            <div class="toggle-group" id="nGrp">
              <button type="button" class="toggle-btn active" data-v="domestic" onclick="selT('nGrp','nationality',this)">내국인</button>
              <button type="button" class="toggle-btn" data-v="foreign" onclick="selT('nGrp','nationality',this)">외국인</button>
            </div>
            <input type="hidden" name="nationality" id="nationality" value="domestic">
          </div>
        </div>
        <div class="form-group">
          <label>주소</label>
          <div style="display:flex;gap:10px;margin-bottom:10px;">
            <input type="text" id="postcode" class="form-control" placeholder="우편번호" readonly style="max-width:150px;">
            <button type="button" class="btn" onclick="searchAddr()">주소 검색</button>
          </div>
          <input type="text" id="addr1" class="form-control" placeholder="기본 주소" readonly style="margin-bottom:10px;">
          <input type="text" name="address" id="addr2" class="form-control" placeholder="상세 주소 입력" th:value="${form?.address}">
        </div>
        <div class="divider"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <button type="submit" class="btn btn-fill">회원가입</button>
          <a th:href="@{/auth/login}" class="txt-link">이미 계정이 있으신가요?</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
function searchAddr(){
  new daum.Postcode({
    oncomplete: function(data){
      document.getElementById('postcode').value = data.zonecode;
      document.getElementById('addr1').value = data.roadAddress || data.jibunAddress;
      document.getElementById('addr2').focus();
      document.getElementById('regForm').setAttribute('data-addr1', data.roadAddress || data.jibunAddress);
    }
  }).open();
}
function selT(g,h,btn){document.getElementById(g).querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById(h).value=btn.dataset.v;}
document.getElementById('regForm').addEventListener('submit',function(e){
  const addr1 = this.getAttribute('data-addr1') || document.getElementById('addr1').value;
  const addr2 = document.getElementById('addr2').value;
  if(addr1) document.getElementById('addr2').value = addr1 + (addr2 ? ' ' + addr2 : '');
  let ok=true;
  function chk(id,eid,fn){const el=document.getElementById(id),er=document.getElementById(eid);if(!fn(el.value)){el.classList.add('is-invalid');er.classList.add('show');ok=false;}else{el.classList.remove('is-invalid');er.classList.remove('show');}}
  chk('uid','e-uid',v=>/^[a-zA-Z0-9]{6,20}$/.test(v));
  chk('pw','e-pw',v=>/^(?=.*[a-zA-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/.test(v));
  chk('cpw','e-cpw',v=>v===document.getElementById('pw').value);
  chk('nm','e-nm',v=>v.trim().length>0);
  chk('bd','e-bd',v=>/^\d{8}$/.test(v));
  chk('ph','e-ph',v=>/^01[0-9]\d{7,8}$/.test(v));
  const em=document.getElementById('email').value;
  if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){document.getElementById('email').classList.add('is-invalid');document.getElementById('e-email').classList.add('show');ok=false;}
  else{document.getElementById('email').classList.remove('is-invalid');document.getElementById('e-email').classList.remove('show');}
  if(!ok)e.preventDefault();
});
document.getElementById('bd').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'');});
document.getElementById('ph').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'');});
</script>
</body>
</html>
