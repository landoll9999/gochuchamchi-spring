<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);}
    .login-box{width:100%;max-width:440px;padding:0 24px;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="login-wrap">
    <div class="login-box">
      <div class="page-title">Welcome back <span class="title-main">Login</span></div>
      <div class="msg-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
      <div class="msg-success" th:if="${success}" th:text="${success}"></div>
      <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" name="username" class="form-control" placeholder="아이디 입력" required>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" name="password" class="form-control" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn btn-fill btn-block" style="margin-top:36px;">로그인</button>
      </form>
      <div style="display:flex;justify-content:center;margin-top:28px;gap:20px;">
        <a href="#" class="txt-link">아이디 찾기</a>
        <span style="color:#e0e0e0;">|</span>
        <a href="#" class="txt-link">비밀번호 찾기</a>
        <span style="color:#e0e0e0;">|</span>
        <a th:href="@{/auth/register}" class="txt-link">회원가입</a>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
