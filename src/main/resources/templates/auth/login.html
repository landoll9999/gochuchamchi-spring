<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — gochuchamchi</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 52px);flex:1;}
    .login-box{width:400px;}
    .input-field{width:100%;background:transparent;border:none;border-bottom:0.5px solid #2a2a2a;padding:14px 0;font-size:14px;color:#fff;font-family:'Noto Sans KR',sans-serif;font-weight:300;outline:none;transition:border-color 0.2s;margin-bottom:20px;}
    .input-field:focus{border-bottom-color:#fff;}
    .input-field::placeholder{color:#333;}
    .login-btn{width:100%;padding:14px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#000;background:#fff;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:300;margin-top:32px;transition:all 0.2s;}
    .login-btn:hover{background:#222;color:#fff;}
    .login-links{display:flex;justify-content:center;margin-top:28px;}
    .login-links a{font-size:11px;color:#444;text-decoration:none;padding:0 16px;transition:color 0.15s;}
    .login-links a:hover{color:#fff;}
    .login-links .sep{color:#2a2a2a;font-size:11px;display:flex;align-items:center;}
  </style>
</head>
<body>
<th:block th:replace="~{layout/sidebar :: sidebar}"></th:block>
<div class="content-wrap">
  <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
  <div class="login-wrap">
    <div class="login-box">
      <div class="page-title">
        Welcome back
        <span class="title-main">Login</span>
      </div>
      <div class="msg-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</div>
      <div class="msg-success" th:if="${success}" th:text="${success}"></div>
      <form th:action="@{/auth/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="text" name="username" class="input-field" placeholder="ID" th:value="${param.username}" required>
        <input type="password" name="password" class="input-field" placeholder="Password" required>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
      <div class="login-links">
        <a href="#">아이디 찾기</a>
        <span class="sep">|</span>
        <a href="#">비밀번호 찾기</a>
        <span class="sep">|</span>
        <a th:href="@{/auth/register}">회원가입</a>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
